<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ShopEasy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="navbar"></header>
<main>
<div class="container"><div class="card auth-card">
  <h1>Welcome back</h1><p class="muted" style="margin-bottom:18px">Log in to your account.</p>
  <div id="form-alert" class="alert"></div>
  <form id="login-form">
    <div class="field"><label for="email">Email</label><input type="email" id="email" required autocomplete="email"></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" required autocomplete="current-password"></div>
    <button class="btn btn-block" type="submit">Login</button>
  </form>
  <p class="center muted" style="margin-top:16px">New here? <a href="register.html">Create an account</a></p>
</div></div>
</main>
<footer id="footer"></footer>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
